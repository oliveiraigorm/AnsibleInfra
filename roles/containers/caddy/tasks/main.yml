---
- name: Create Caddy config directory
  file:
    path: "{{ docker_dir }}/{{ container_name }}"
    state: directory

- name: Copy Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ docker_dir }}/{{ container_name }}/Caddyfile"
  register: caddyfile

- name: Make sure the Caddy container is created and running
  docker_container:
    name: "{{ container_name }}"
    image: caddy:latest
    pull: yes
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/Caddyfile:/etc/caddy/Caddyfile"
      - "{{ docker_dir }}/{{ container_name }}/data:/data"
      - "{{ docker_dir }}/{{ container_name }}/config:/config"
    restart: "{{ caddyfile.changed }}"
