---
- name: Add netdata directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0755
    state: directory

- name: Add netdataconfig directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/netdataconfig"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0755
    state: directory

- name: Force disk-space monitoring for the external drives
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: "{{ docker_dir }}/{{ container_name }}/netdataconfig/netdata.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0644
  register: netdata_conf

- name: Add netdatalib directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/netdatalib"
    # owner: "{{ username }}"
    # group: "{{ username }}"
    mode: 0755
    state: directory

- name: Add netdatacache directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/netdatacache"
    # owner: "{{ username }}"
    # group: "{{ username }}"
    mode: 0755
    state: directory

- name: Make sure the {{ container_name }} container is created and running
  docker_container:
    name: "{{ container_name }}"
    image: netdata/netdata:latest
    pull: yes
    state: 'started'
    volumes:
      - "{{ docker_dir }}/{{ container_name }}/netdataconfig:/etc/netdata"
      - "{{ docker_dir }}/{{ container_name }}/netdatalib:/var/lib/netdata"
      - "{{ docker_dir }}/{{ container_name }}/netdatacache:/var/cache/netdata"
      - "/etc/passwd:/host/etc/passwd:ro"
      - "/etc/group:/host/etc/group:ro"
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/etc/os-release:/host/etc/os-release:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # - "/home/igor/mnt:/mnt:ro"
      - "/home/igor/mnt/sk-1000:/mnt/sk-1000:ro"
      - "/home/igor/mnt/wd-1000:/mnt/wd-1000:ro"
      - "/home/igor/mnt/es-500:/mnt/es-500:ro"
    restart_policy: unless-stopped
    # ports:
    #   - "19999:19999"
    network_mode: host
    capabilities:
      - SYS_PTRACE
      - SYS_ADMIN
    env:
      NETDATA_CLAIM_TOKEN: "{{ netdata_claim_token }}"
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: "{{ netdata_claim_rooms }}"
      PUSHBULLET_ACCESS_TOKEN: "{{ pushbullet_key }}"
      PUSHBULLET_DEFAULT_EMAIL: your-email@example.com
    security_opts:
      - "apparmor:unconfined"

- name: Add netdata health.d directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/netdataconfig/health.d"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0755
    state: directory

- name: Create health_alarm_notify.conf
  ansible.builtin.template:
    src: health_alarm_notify.conf.j2
    dest: "{{ docker_dir }}/{{ container_name }}/netdataconfig/health_alarm_notify.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0755

- name: Create file_descriptors alarm override
  ansible.builtin.template:
    src: file_descriptors.conf.j2
    dest: "{{ docker_dir }}/{{ container_name }}/netdataconfig/health.d/file_descriptors.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0644

- name: Create disk_space alarm override
  ansible.builtin.template:
    src: disks.conf.j2
    dest: "{{ docker_dir }}/{{ container_name }}/netdataconfig/health.d/disks.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0644

- name: Add netdata go.d directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ container_name }}/netdataconfig/go.d"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0755
    state: directory

- name: Configure HTTP availability checks for key services
  ansible.builtin.template:
    src: httpcheck.conf.j2
    dest: "{{ docker_dir }}/{{ container_name }}/netdataconfig/go.d/httpcheck.conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0644
  register: netdata_httpcheck

- name: Restart netdata to apply config changes
  docker_container:
    name: "{{ container_name }}"
    restart: true
  when: netdata_conf is changed or netdata_httpcheck is changed

- name: Send Pushbullet test notification
  shell: |
    docker exec -it netdata /usr/libexec/netdata/plugins.d/alarm-notify.sh test
  when: pushbullet_key is defined
